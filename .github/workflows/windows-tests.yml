name: Windows Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: CI validates the repo's scripts; it must NEVER execute them.
      # Setup.ps1 in particular overwrites $PROFILE and clones repos — do not run it here.

      - name: Parse-check all PowerShell files
        run: |
          $failed = $false
          Get-ChildItem -Path . -Recurse -Include *.ps1, *.psm1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PARSE ERRORS in $($_.FullName):" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host "  [$($_.Extent.StartLineNumber),$($_.Extent.StartColumnNumber)] $($_.Message)" }
            } else {
              Write-Host "OK: $($_.FullName)"
            }
          }
          if ($failed) { throw 'One or more files failed to parse.' }

      - name: PSScriptAnalyzer (fail on Error severity only)
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse
          $warnings = @($results | Where-Object Severity -eq 'Warning')
          $errors   = @($results | Where-Object Severity -eq 'Error')
          if ($warnings.Count -gt 0) {
            Write-Host "PSScriptAnalyzer warnings ($($warnings.Count)) — reported, not failing:" -ForegroundColor Yellow
            $warnings | Format-Table RuleName, ScriptName, Line, Message -AutoSize | Out-String -Width 4096 | Write-Host
          }
          if ($errors.Count -gt 0) {
            Write-Host "PSScriptAnalyzer errors ($($errors.Count)):" -ForegroundColor Red
            $errors | Format-Table RuleName, ScriptName, Line, Message -AutoSize | Out-String -Width 4096 | Write-Host
            throw 'PSScriptAnalyzer reported Error-severity findings.'
          }
          Write-Host 'PSScriptAnalyzer: no Error-severity findings.'

      - name: Validate and import module manifests
        run: |
          $manifests = @(
            'modules/ActiveDirectoryUtils/ActiveDirectoryUtils.psd1',
            'modules/PersonalUtils/PersonalUtils.psd1'
          )
          foreach ($manifest in $manifests) {
            $path = Join-Path $env:GITHUB_WORKSPACE $manifest
            Write-Host "Testing manifest: $manifest"
            Test-ModuleManifest -Path $path | Format-List Name, Version, ExportedFunctions | Out-String | Write-Host
            Write-Host "Importing module: $manifest"
            Import-Module $path -Force -ErrorAction Stop
            Write-Host "OK: $manifest imported."
          }

      - name: Profile smoke test (dot-source in fresh pwsh -NoProfile)
        run: |
          $profileScript = Join-Path $env:GITHUB_WORKSPACE 'PSProfile.ps1'
          pwsh -NoProfile -NonInteractive -Command ". '$profileScript'"
          if ($LASTEXITCODE -ne 0) {
            throw "PSProfile.ps1 smoke test failed with exit code $LASTEXITCODE."
          }
          Write-Host 'PSProfile.ps1 dot-sourced cleanly in a fresh pwsh -NoProfile process.'
