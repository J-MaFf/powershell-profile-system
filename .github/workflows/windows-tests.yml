name: Windows Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Thin caller for the shared reusable lint job (parse-check + PSScriptAnalyzer,
  # Error-severity fail only) — see J-MaFf/.github for the implementation.
  lint:
    uses: J-MaFf/.github/.github/workflows/ps-lint.yml@main

  # Repo-specific validation beyond the shared lint. CI validates the repo's
  # scripts; it must NEVER execute them. Setup.ps1 in particular overwrites
  # $PROFILE and clones repos — do not run it here. (The profile smoke test
  # dot-sources PSProfile.ps1 deliberately — it is side-effect-free.)
  validate:
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate and import module manifests
        run: |
          $manifests = @(
            'modules/ActiveDirectoryUtils/ActiveDirectoryUtils.psd1',
            'modules/PersonalUtils/PersonalUtils.psd1'
          )
          foreach ($manifest in $manifests) {
            $path = Join-Path $env:GITHUB_WORKSPACE $manifest
            Write-Host "Testing manifest: $manifest"
            Test-ModuleManifest -Path $path | Format-List Name, Version, ExportedFunctions | Out-String | Write-Host
            Write-Host "Importing module: $manifest"
            Import-Module $path -Force -ErrorAction Stop
            Write-Host "OK: $manifest imported."
          }

      - name: Profile smoke test (dot-source in fresh pwsh -NoProfile)
        run: |
          $profileScript = Join-Path $env:GITHUB_WORKSPACE 'PSProfile.ps1'
          pwsh -NoProfile -NonInteractive -Command ". '$profileScript'"
          if ($LASTEXITCODE -ne 0) {
            throw "PSProfile.ps1 smoke test failed with exit code $LASTEXITCODE."
          }
          Write-Host 'PSProfile.ps1 dot-sourced cleanly in a fresh pwsh -NoProfile process.'
